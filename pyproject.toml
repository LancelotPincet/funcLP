[project]
name = "funclp"
version = "0.1.21"
description = "A library for defining mathematical functions and fits."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["corelp", "numba", "numpy", "plotlp", "scipy"]

[project.optional-dependencies]
cuda12 = ["cupy-cuda12x"]
cuda13 = ["cupy-cuda13x"]
docs = ["sphinx", "sphinx-design", "sphinx-rtd-theme", "tomlkit"]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[dependency-groups]
tests = ["pytest"]
docs = ["sphinx", "sphinx-design", "sphinx-rtd-theme", "tomlkit"]
anaconda = ["ipykernel", "spyder-kernels"]

[tool.uv]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'", "sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')"]

[tool.uv.sources.corelp]
workspace = true

[tool.uv.sources.plotlp]
workspace = true
